// Generatorها — نسخه فشرده
function genAlkanes(){ALKANES.forEach(a=>{const oF=ALKANES.filter(x=>x.n!==a.n).map(x=>x.f);const oN=ALKANES.filter(x=>x.n!==a.n).map(x=>x.name);let r=buildOpts(a.f,oF);if(r)addQ('شیمی نفت',`فرمول «${a.name}»؟`,r.opts,r.ans);r=buildOpts(a.name,oN);if(r)addQ('شیمی نفت',`نام «${a.f}»؟`,r.opts,r.ans);const wC=[a.n+1,a.n+2,a.n-1,a.n+3].filter(x=>x>0&&x!==a.n).map(String);r=buildOpts(String(a.n),wC);if(r)addQ('شیمی نفت',`${a.name} چند اتم کربن دارد؟`,r.opts,r.ans)})}
function genAcronyms(){ACRONYMS.forEach(ac=>{const oE=ACRONYMS.filter(x=>x.a!==ac.a).map(x=>x.e);const oP=ACRONYMS.filter(x=>x.a!==ac.a).map(x=>x.p);let r=buildOpts(ac.e,oE);if(r)addQ('اختصارات',`«${ac.a}» به چه معناست؟`,r.opts,r.ans);r=buildOpts(ac.p,oP);if(r)addQ('اختصارات',`معادل فارسی «${ac.a}»؟`,r.opts,r.ans)})}
function genPetrochem(){PETRO.forEach(p=>{const oM=PETRO.filter(x=>x.p!==p.p).map(x=>x.m);const oP=PETRO.filter(x=>x.p!==p.p).map(x=>x.p);let r=buildOpts(p.p,oP);if(r)addQ('پتروشیمی',`مونومر «${p.m}» برای کدام پلیمر؟`,r.opts,r.ans);r=buildOpts(p.m,oM);if(r)addQ('پتروشیمی',`پلیمر «${p.p}» از چه مونومری؟`,r.opts,r.ans)})}
function genCountries(){COUNTRIES.forEach(c=>{const oC=[...new Set(COUNTRIES.map(x=>x.cont))].filter(x=>x!==c.cont);let r=buildOpts(c.cont,oC);if(r)addQ('جغرافیا',`کشور «${c.n}» در کدام قاره/منطقه؟`,r.opts,r.ans);if(c.rank<=5){const oR=['رتبه ۱','رتبه ۲','رتبه ۳','رتبه ۴','رتبه ۵','رتبه ۶','رتبه ۷','رتبه ۸'].filter(x=>x!==`رتبه ${c.rank}`);r=buildOpts(`رتبه ${c.rank}`,oR);if(r)addQ('جغرافیا',`ذخایر نفت «${c.n}» در رتبه؟`,r.opts,r.ans)}})}
function genFields(){FIELDS.forEach(f=>{const oC=[...new Set(FIELDS.map(x=>x.c))].filter(x=>x!==f.c);let r=buildOpts(f.c,oC);if(r)addQ('میادین نفتی',`میدان «${f.n}» در کدام کشور؟`,r.opts,r.ans)});const gh=FIELDS.find(x=>x.n==='غوار');if(gh){const w=['اهواز','نوروز','بورگان'].filter(x=>x!==gh.n);const r=buildOpts(gh.n,w);if(r)addQ('میادین نفتی','بزرگ‌ترین میدان نفتی جهان؟',r.opts,r.ans)}}
function genRef(){REF.forEach(r=>{const oC=[...new Set(REF.map(x=>x.c))].filter(x=>x!==r.c);let rr=buildOpts(r.c,oC);if(rr)addQ('پالایش',`پالایشگاه «${r.n}» در کدام کشور؟`,rr.opts,rr.ans)});const jam=REF.find(x=>x.n==='جامناگر');if(jam){const w=REF.filter(x=>x.n!==jam.n).slice(0,3).map(x=>x.n);const r=buildOpts(jam.n,w);if(r)addQ('پالایش','بزرگ‌ترین پالایشگاه جهان؟',r.opts,r.ans)}}
function genGases(){const names=GASES.map(x=>x.name);const forms=GASES.map(x=>x.f);GASES.forEach(g=>{const oF=forms.filter(x=>x!==g.f);let r=buildOpts(g.f,oF);if(r)addQ('شیمی نفت',`فرمول «${g.name}»؟`,r.opts,r.ans);const oN=names.filter(x=>x!==g.name);r=buildOpts(g.name,oN);if(r)addQ('شیمی نفت',`نام «${g.f}»؟`,r.opts,r.ans)})}
function genEquipment(){const eq=[{n:'Separator',d:'جداسازی نفت، گاز و آب'},{n:'Heat Exchanger',d:'تبادل حرارت بین دو سیال'},{n:'Furnace',d:'گرم کردن سیال فرآیندی'},{n:'Reboiler',d:'تأمین حرارت برج تقطیر'},{n:'Condenser',d:'مایع کردن بخار بالای برج'},{n:'Compressor',d:'فشرده کردن گاز'},{n:'Pump',d:'افزایش فشار مایع'},{n:'Valve',d:'کنترل جریان سیال'},{n:'Reactor',d:'انجام واکنش شیمیایی'},{n:'Scrubber',d:'حذف گازهای اسیدی'},{n:'Flare',d:'سوزاندن گازهای اضافی'},{n:'Desalter',d:'حذف نمک از نفت خام'}];const ds=eq.map(x=>x.d);eq.forEach(e=>{const w=ds.filter(x=>x!==e.d);const r=buildOpts(e.d,w);if(r)addQ('تجهیزات',`کاربرد «${e.n}»؟`,r.opts,r.ans)})}
function genEOR(){const eor=[{n:'Water Flooding',d:'تزریق آب برای راندن نفت'},{n:'CO₂ Flooding',d:'تزریق دی‌اکسید کربن برای کاهش گرانروی'},{n:'Polymer Flooding',d:'تزریق پلیمر برای بهبود جاروبی'},{n:'Surfactant Flooding',d:'تزریق سورفکتانت برای کاهش کشش سطحی'},{n:'Steam Injection',d:'تزریق بخار برای نفت سنگین'},{n:'SAGD',d:'زهکشی ثقلی با کمک بخار'},{n:'CSS',d:'تحریک چرخه‌ای بخار'},{n:'WAG',d:'تزریق متناوب آب و گاز'}];const ds=eor.map(x=>x.d);eor.forEach(e=>{const w=ds.filter(x=>x!==e.d);const r=buildOpts(e.d,w);if(r)addQ('بهره‌برداری',`روش «${e.n}» چیست؟`,r.opts,r.ans)})}
function genDrill(){const df=[{n:'بنتونیت',d:'افزایش ویسکوزیته گل'},{n:'باریت',d:'افزایش وزن گل'},{n:'CMC',d:'کاهش اتلاف آب'},{n:'نمک NaCl',d:'افزایش چگالی گل'},{n:'آهک',d:'تنظیم pH گل'},{n:'دیزل',d:'پایه گل روغنی'},{n:'میکا',d:'کنترل هرزروی'}];const ds=df.map(x=>x.d);df.forEach(e=>{const w=ds.filter(x=>x!==e.d);const r=buildOpts(e.d,w);if(r)addQ('حفاری',`کاربرد «${e.n}» در گل حفاری؟`,r.opts,r.ans)})}
function genCat(){const cat=[{n:'پلاتین',u:'ریفرمینگ کاتالیستی'},{n:'زئولیت',u:'کراکینگ FCC'},{n:'Co-Mo',u:'هیدروگوگردزدایی HDS'},{n:'Ni-Mo',u:'هیدروکراکینگ'},{n:'نیکل',u:'هیدروژناسیون'},{n:'آهن',u:'سنتز آمونیاک'}];const us=cat.map(x=>x.u);cat.forEach(e=>{const w=us.filter(x=>x!==e.u);const r=buildOpts(e.u,w);if(r)addQ('پالایش',`کاتالیست «${e.n}»؟`,r.opts,r.ans)})}
function genStand(){const st=[{n:'API 610',d:'پمپ گریز از مرکز'},{n:'API 650',d:'مخازن ذخیره جوشی'},{n:'API 5L',d:'لوله‌های خطوط انتقال'},{n:'API 5CT',d:'لوله جداری و مغزی'},{n:'API 6A',d:'تجهیزات سرچاهی'},{n:'API 16A',d:'تجهیزات BOP'},{n:'ISO 9001',d:'مدیریت کیفیت'},{n:'ISO 14001',d:'مدیریت محیط زیست'}];const ds=st.map(x=>x.d);st.forEach(e=>{const w=ds.filter(x=>x!==e.d);const r=buildOpts(e.d,w);if(r)addQ('استانداردها',`استاندارد «${e.n}»؟`,r.opts,r.ans)})}
function genCor(){const c=[{n:'خوردگی یکنواخت',d:'حمله به تمام سطح فلز'},{n:'خوردگی گالوانیک',d:'بین دو فلز مختلف'},{n:'خوردگی حفره‌ای',d:'موضعی به شکل حفره'},{n:'خوردگی تنشی (SCC)',d:'ترک تحت تنش و محیط خورنده'},{n:'خوردگی سولفیدی (SSC)',d:'ترک در حضور H₂S'},{n:'خوردگی میکروبی (MIC)',d:'ناشی از باکتری‌ها'}];const ds=c.map(x=>x.d);c.forEach(e=>{const w=ds.filter(x=>x!==e.d);const r=buildOpts(e.d,w);if(r)addQ('خوردگی',`«${e.n}» چیست؟`,r.opts,r.ans)})}
function genHSE(){const h=[{n:'CO₂',d:'گاز گلخانه‌ای اصلی'},{n:'CH₄',d:'گاز گلخانه‌ای قوی'},{n:'SO₂',d:'گاز اسیدی گوگرد سوخت'},{n:'H₂S',d:'گاز سمی و بدبو'},{n:'VOC',d:'ترکیبات آلی فرار'},{n:'PM',d:'ذرات معلق'}];const ds=h.map(x=>x.d);h.forEach(e=>{const w=ds.filter(x=>x!==e.d);const r=buildOpts(e.d,w);if(r)addQ('ایمنی (HSE)',`«${e.n}» چیست؟`,r.opts,r.ans)})}
function genMisc(){const qs=[{q:'گاز شوی (Scrubber) برای چه؟',a:'حذف گازهای اسیدی',w:['حذف آب','حذف گوگرد','فشرده‌سازی گاز']},{q:'نم‌گیری گاز با چه ماده‌ای؟',a:'TEG',w:['آب','الکل','اسید']},{q:'مهم‌ترین جزء گاز شیرین؟',a:'متان',w:['اتان','پروپان','CO₂']},{q:'گاز ترش چیست؟',a:'حاوی H₂S و CO₂',w:['رطوبت بالا','گرم','پرفشار']},{q:'هدف واحد SRU؟',a:'بازیافت گوگرد از گاز اسیدی',w:['تولید گاز','حذف آب','فشرده‌سازی']},{q:'فرآیند کلاز چه می‌کند؟',a:'تبدیل H₂S به گوگرد عنصری',w:['حذف CO₂','تولید گاز','حذف آب']},{q:'واحد الفین برای تولید؟',a:'اتیلن و پروپیلن',w:['متانول','اوره','بنزین']}];qs.forEach(e=>{const r=buildOpts(e.a,e.w);if(r)addQ('فرآیندها',e.q,r.opts,r.ans)})}

genAlkanes();genAcronyms();genPetrochem();genCountries();genFields();genRef();genGases();genEquipment();genEOR();genDrill();genCat();genStand();genCor();genHSE();genMisc();
