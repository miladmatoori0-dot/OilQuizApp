<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>کوییز دانشکده نفت اهواز</title>
<style>
:root{--bg:linear-gradient(160deg,#0d1b2a,#1b263b 50%,#0d1b2a);--card:#1b263b;--card2:#22304a;--accent:#ffb703;--accent2:#fb8500;--green:#2ecc71;--red:#e74c3c;--text:#e0e1dd;--muted:#8d99ae;--shadow:0 15px 40px rgba(0,0,0,.5)}
html.light{--bg:linear-gradient(160deg,#f5f7fa,#e8eef5 50%,#f5f7fa);--card:#fff;--card2:#f0f4f8;--accent:#d97706;--accent2:#b45309;--green:#16a34a;--red:#dc2626;--text:#1a202c;--muted:#64748b;--shadow:0 15px 40px rgba(0,0,0,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:10px;transition:.3s}
#app{width:100%;max-width:560px}
.screen{display:none;background:var(--card);border-radius:20px;padding:20px 16px;box-shadow:var(--shadow)}
.screen.active{display:block}
.brand{text-align:center;padding:18px 12px 14px;border-radius:16px;background:linear-gradient(135deg,var(--card),var(--card2));margin-bottom:16px;border:1px solid rgba(255,183,3,.25);position:relative}
.oil-icon{width:76px;height:76px;margin:0 auto 8px;display:block}
.brand-title{font-size:18px;font-weight:bold;color:var(--accent)}
.brand-sub{font-size:12px;color:var(--muted);margin-top:6px}
.theme-btn,.sound-btn{position:absolute;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,183,3,.15);border:1px solid rgba(255,183,3,.3);color:var(--accent);font-size:18px;cursor:pointer;padding:0}
.theme-btn{left:12px}.sound-btn{right:12px}.sound-btn.muted{opacity:.4}
h2{font-size:16px;text-align:center;margin-bottom:12px;color:var(--accent)}
h3{font-size:13px;color:var(--accent);margin:14px 0 6px;text-align:right}
button{width:100%;padding:14px;margin:6px 0;border:none;border-radius:12px;background:var(--card2);color:var(--text);font-size:14.5px;font-family:inherit;cursor:pointer;font-weight:500;transition:.15s}
button:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d1b2a;font-weight:bold;font-size:15.5px}
html.light .btn-primary{color:#fff}
.btn-green{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;font-weight:bold}
.btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;font-weight:bold}
.best-badge{text-align:center;background:rgba(255,183,3,.1);border:1px dashed rgba(255,183,3,.4);padding:7px;border-radius:10px;margin-bottom:10px;font-size:11.5px;color:var(--accent)}
.level-tabs{display:flex;gap:6px;margin-bottom:14px}
.level-tabs button{flex:1;padding:9px 6px;font-size:11.5px;margin:0;background:var(--card2);border-radius:10px;border:1px solid transparent}
.level-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0d1b2a;font-weight:bold}
html.light .level-tabs button.active{color:#fff}
.level-tabs button.locked-tab{opacity:.5}
.stage-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.stage-btn{aspect-ratio:1;border-radius:10px;background:var(--card2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:bold;cursor:pointer;position:relative;padding:2px}
.stage-btn.locked{opacity:.35;cursor:not-allowed}
.stage-btn.locked::after{content:"🔒";position:absolute;inset:0;background:rgba(0,0,0,.7);border-radius:10px;display:flex;align-items:center;justify-content:center}
.stage-btn.passed{background:linear-gradient(135deg,rgba(46,204,113,.25),rgba(46,204,113,.1));border-color:var(--green);color:var(--green)}
.stage-btn.current{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,183,3,.2)}
.stage-btn .num{font-size:13px}
.stage-btn .pct{font-size:9px;color:var(--muted);margin-top:3px;font-weight:normal}
.top-bar{display:flex;justify-content:space-between;margin-bottom:10px;font-size:11.5px;color:var(--muted)}
.top-bar .pill{background:var(--card2);padding:5px 11px;border-radius:20px;font-weight:bold;color:var(--accent)}
.progress-bar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
.q-cat-tag{display:inline-block;font-size:10.5px;background:rgba(255,183,3,.12);color:var(--accent);padding:3px 9px;border-radius:12px;margin-bottom:10px}
.q-text{font-size:15px;line-height:1.85;margin-bottom:16px;padding:14px;background:var(--card2);border-radius:12px;border-right:3px solid var(--accent);min-height:70px;display:flex;align-items:center}
.opt-btn{background:var(--card2);text-align:right;padding:12px 42px 12px 14px;font-size:13.5px;border-radius:11px;border:2px solid transparent;position:relative;display:block}
.opt-letter{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:6px;background:rgba(255,183,3,.12);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
.opt-btn.correct{background:rgba(46,204,113,.2)!important;border-color:var(--green);color:var(--green)}
.opt-btn.correct .opt-letter{background:var(--green);color:#fff}
.opt-btn.wrong{background:rgba(231,76,60,.2)!important;border-color:var(--red);color:var(--red)}
.opt-btn.wrong .opt-letter{background:var(--red);color:#fff}
.result-icon{font-size:52px;text-align:center;margin:8px 0}
.result-score{text-align:center;font-size:38px;font-weight:bold;color:var(--accent);margin:6px 0}
.result-msg{text-align:center;font-size:13.5px;line-height:1.85;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}
.stat-box{background:var(--card2);padding:10px 5px;border-radius:11px;text-align:center}
.stat-num{font-size:18px;font-weight:bold;color:var(--accent)}
.stat-label{font-size:10px;color:var(--muted);margin-top:3px}
.footer-note{text-align:center;font-size:9.5px;color:var(--muted);margin-top:14px;line-height:1.9;padding:10px 6px;border-top:1px solid rgba(255,183,3,.15)}
.hidden{display:none!important}
.retry-info{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;font-style:italic}
</style>
</head>
<body>
<div id="app">
  <div id="start" class="screen active">
    <div class="brand">
      <button class="theme-btn" onclick="toggleTheme()">☀️</button>
      <button class="sound-btn" onclick="toggleSound()">🔊</button>
      <svg class="oil-icon" viewBox="0 0 100 100"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffb703"/><stop offset="100%" stop-color="#fb8500"/></linearGradient></defs>
        <polygon points="50,10 42,35 58,35" fill="url(#g1)"/><rect x="46" y="35" width="8" height="20" fill="url(#g1)"/>
        <line x1="42" y1="35" x2="30" y2="55" stroke="url(#g1)" stroke-width="2"/><line x1="58" y1="35" x2="70" y2="55" stroke="url(#g1)" stroke-width="2"/>
        <line x1="38" y1="45" x2="62" y2="45" stroke="url(#g1)" stroke-width="1.5"/><line x1="34" y1="50" x2="66" y2="50" stroke="url(#g1)" stroke-width="1.5"/>
        <ellipse cx="50" cy="62" rx="30" ry="6" fill="#1a1a1a" opacity=".9"/><ellipse cx="50" cy="65" rx="32" ry="7" fill="url(#g1)" opacity=".8"/>
        <path d="M 50 75 Q 44 82 44 86 Q 44 91 50 91 Q 56 91 56 86 Q 56 82 50 75 Z" fill="url(#g1)"/></svg>
      <div class="brand-title">کوییز دانشکده نفت اهواز</div>
      <div class="brand-sub">صنایع نفت • گاز • پالایش • پتروشیمی • حفاری • HSE</div>
    </div>
    <div id="bestScoreBox" class="best-badge hidden"></div>
    <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:8px;">بانک: <strong id="bankSize" style="color:var(--accent)">…</strong> سوال</div>
    <h2>۱۰۰ مرحله • ۴ سطح</h2>
    <button class="btn-primary" onclick="showStagesScreen(1)">🚀 شروع / ادامهٔ بازی</button>
    <button onclick="showStats()">📊 آمار و رکوردها</button>
    <button onclick="resetAll()" style="background:transparent;color:var(--muted);font-size:12px;">🔄 ریست پیشرفت</button>
    <div class="footer-note">کوییز دانشکده نفت اهواز • نسخه ۷.۰ • کاملاً آفلاین<br>تمامی حقوق مادی و معنوی متعلق به مرکز فناوری اطلاعات و ارتباطات دانشکده نفت اهواز می‌باشد.</div>
  </div>
  <div id="stagesScreen" class="screen"><h2>مرحله را انتخاب کن</h2><div class="level-tabs" id="levelTabs"></div><div class="stage-grid" id="stageGrid"></div><button onclick="goHome()">← بازگشت</button></div>
  <div id="quizScreen" class="screen">
    <div class="top-bar"><span class="pill" id="scorePill">امتیاز: 0</span><span id="questionCounter">سوال ۱ از ۱۰</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="q-cat-tag" id="qCatTag">...</span>
    <div class="q-text" id="qText">...</div>
    <div id="optionsBox"></div>
    <button id="nextBtn" class="btn-primary hidden" onclick="nextQuestion()">سوال بعدی ←</button>
    <button onclick="quitGame()" style="background:transparent;color:var(--muted);font-size:11.5px;margin-top:8px;">انصراف</button>
  </div>
  <div id="resultScreen" class="screen">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="stat-grid"><div class="stat-box"><div class="stat-num" id="statCorrect">0</div><div class="stat-label">صحیح</div></div><div class="stat-box"><div class="stat-num" id="statWrong">0</div><div class="stat-label">غلط</div></div><div class="stat-box"><div class="stat-num" id="statPercent">0%</div><div class="stat-label">درصد</div></div></div>
    <div id="resultBtns"></div><div class="retry-info" id="retryInfo"></div>
  </div>
  <div id="statsScreen" class="screen"><h2>📊 آمار شما</h2><div id="statsContent"></div><button onclick="goHome()">← بازگشت</button></div>
</div>

<script>
// ============ صدا ============
let audioCtx=null,soundEnabled=true;
try{const s=localStorage.getItem('oil_quiz_sound');if(s!==null)soundEnabled=s==='true'}catch(e){}
function initAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}}}
function playTone(f,d,t,v){if(!soundEnabled)return;initAudio();if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.15,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function soundCorrect(){setTimeout(()=>playTone(523.25,0.15,'sine',0.18),0);setTimeout(()=>playTone(659.25,0.15,'sine',0.18),100);setTimeout(()=>playTone(783.99,0.3,'sine',0.18),200)}
function soundWrong(){playTone(220,0.2,'sawtooth',0.12);setTimeout(()=>playTone(165,0.3,'sawtooth',0.12),150)}
function soundClick(){playTone(800,0.05,'sine',0.08)}
function soundWin(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>playTone(f,0.25,'sine',0.2),i*120))}
function soundFail(){[392,349.23,293.66,261.63].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'triangle',0.15),i*150))}
function toggleSound(){soundEnabled=!soundEnabled;try{localStorage.setItem('oil_quiz_sound',soundEnabled)}catch(e){}document.querySelectorAll('.sound-btn').forEach(b=>{b.textContent=soundEnabled?'🔊':'🔇';b.classList.toggle('muted',!soundEnabled)});if(soundEnabled){initAudio();soundClick()}}

// ============ تم ============
let currentTheme='dark';
try{const t=localStorage.getItem('oil_quiz_theme');if(t)currentTheme=t}catch(e){}
function applyTheme(){document.documentElement.classList.toggle('light',currentTheme==='light');document.querySelectorAll('.theme-btn').forEach(b=>b.textContent=currentTheme==='light'?'🌙':'☀️')}
function toggleTheme(){currentTheme=currentTheme==='dark'?'light':'dark';try{localStorage.setItem('oil_quiz_theme',currentTheme)}catch(e){}applyTheme();soundClick()}

// ============ بانک سوالات ============
const _shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const _pick=(a,n)=>_shuffle(a).slice(0,n);
const BANK=[];
const buildOpts=(c,w,n=3)=>{const u=[...new Set(w.filter(x=>x!==c&&x!=null&&x!==''))];if(u.length<n)return null;const p=_pick(u,n);const o=_shuffle([c,...p]);return{opts:o,ans:o.indexOf(c)}};
const addQ=(l,c,q,o,a)=>{if(!Array.isArray(o)||o.length!==4||a<0||a>3)return;const k=q+'|'+o.join('|');if(BANK.some(x=>x.k===k))return;BANK.push({l,c,q,o,a,k})};

// داده‌های پایه
const ALKANES=[{n:1,name:'متان',f:'CH₄'},{n:2,name:'اتان',f:'C₂H₆'},{n:3,name:'پروپان',f:'C₃H₈'},{n:4,name:'بوتان',f:'C₄H₁₀'},{n:5,name:'پنتان',f:'C₅H₁₂'},{n:6,name:'هکسان',f:'C₆H₁₄'},{n:7,name:'هپتان',f:'C₇H₁₆'},{n:8,name:'اکتان',f:'C₈H₁₈'},{n:9,name:'نونان',f:'C₉H₂₀'},{n:10,name:'دکان',f:'C₁₀H₂₂'}];
const ACRONYMS=[{a:'BOP',e:'Blowout Preventer',p:'پیشگیری از فوران چاه'},{a:'FCC',e:'Fluid Catalytic Cracking',p:'کراکینگ کاتالیستی'},{a:'EOR',e:'Enhanced Oil Recovery',p:'ازدیاد برداشت'},{a:'HSE',e:'Health Safety Environment',p:'بهداشت، ایمنی و محیط زیست'},{a:'MSDS',e:'Material Safety Data Sheet',p:'برگه اطلاعات ایمنی'},{a:'LNG',e:'Liquefied Natural Gas',p:'گاز طبیعی مایع'},{a:'LPG',e:'Liquefied Petroleum Gas',p:'گاز مایع نفتی'},{a:'CNG',e:'Compressed Natural Gas',p:'گاز طبیعی فشرده'},{a:'NGL',e:'Natural Gas Liquids',p:'مایعات گاز طبیعی'},{a:'API',e:'American Petroleum Institute',p:'انجمن نفت آمریکا'},{a:'OPEC',e:'Organization of Petroleum Exporting Countries',p:'سازمان کشورهای صادرکننده نفت'},{a:'GOR',e:'Gas Oil Ratio',p:'نسبت گاز به نفت'},{a:'ROP',e:'Rate of Penetration',p:'سرعت نفوذ مته'},{a:'TVD',e:'True Vertical Depth',p:'عمق قائم واقعی'},{a:'WOB',e:'Weight On Bit',p:'وزن روی مته'},{a:'ESP',e:'Electric Submersible Pump',p:'پمپ درون‌چاهی'},{a:'PCP',e:'Progressing Cavity Pump',p:'پمپ حفره‌ای پیشرونده'},{a:'SAGD',e:'Steam Assisted Gravity Drainage',p:'زهکشی ثقلی با بخار'},{a:'CSS',e:'Cyclic Steam Stimulation',p:'تحریک چرخه‌ای بخار'},{a:'WAG',e:'Water Alternating Gas',p:'تزریق متناوب آب و گاز'},{a:'HPHT',e:'High Pressure High Temperature',p:'فشار و دمای بالا'},{a:'BHA',e:'Bottom Hole Assembly',p:'مجموعه مته پایین چاه'},{a:'MWD',e:'Measurement While Drilling',p:'اندازه‌گیری حین حفاری'},{a:'LWD',e:'Logging While Drilling',p:'نموداربرداری حین حفاری'},{a:'PPE',e:'Personal Protective Equipment',p:'تجهیزات حفاظت فردی'},{a:'LEL',e:'Lower Explosive Limit',p:'حد پایین اشتعال‌پذیری'},{a:'UEL',e:'Upper Explosive Limit',p:'حد بالای اشتعال‌پذیری'},{a:'FPSO',e:'Floating Production Storage Offloading',p:'شناور تولید و ذخیره'},{a:'TEG',e:'Triethylene Glycol',p:'تری‌اتیلن گلیکول'},{a:'BTX',e:'Benzene Toluene Xylene',p:'بنزن، تولوئن، زایلن'},{a:'HDS',e:'Hydrodesulfurization',p:'هیدروگوگردزدایی'},{a:'SRU',e:'Sulfur Recovery Unit',p:'واحد بازیافت گوگرد'},{a:'CDU',e:'Crude Distillation Unit',p:'واحد تقطیر نفت خام'},{a:'VDU',e:'Vacuum Distillation Unit',p:'واحد تقطیر در خلأ'}];
const PETRO=[{m:'اتیلن',p:'پلی‌اتیلن (PE)'},{m:'پروپیلن',p:'پلی‌پروپیلن (PP)'},{m:'وینیل کلراید',p:'پلی‌وینیل کلراید (PVC)'},{m:'استایرن',p:'پلی‌استایرن (PS)'},{m:'بوتادین و استایرن',p:'لاستیک SBR'},{m:'اتیلن گلیکول + ترفتالیک',p:'پلی‌اتیلن ترفتالات (PET)'},{m:'تترافلوئورواتیلن',p:'پلی‌تترافلوئورواتیلن (PTFE)'},{m:'متیل متاکریلات',p:'پلی‌متیل متاکریلات (PMMA)'},{m:'کاپرولاکتام',p:'نایلون ۶'},{m:'ایزوسیانات + پلی‌اُل',p:'پلی‌یورتان (PU)'}];
const COUNTRIES=[{n:'ونزوئلا',rank:1,cont:'آمریکای جنوبی'},{n:'عربستان سعودی',rank:2,cont:'خاورمیانه'},{n:'کانادا',rank:3,cont:'آمریکای شمالی'},{n:'ایران',rank:4,cont:'خاورمیانه'},{n:'عراق',rank:5,cont:'خاورمیانه'},{n:'کویت',rank:6,cont:'خاورمیانه'},{n:'امارات',rank:7,cont:'خاورمیانه'},{n:'روسیه',rank:8,cont:'اوراسیا'},{n:'لیبی',rank:9,cont:'آفریقا'},{n:'نیجریه',rank:10,cont:'آفریقا'},{n:'قطر',rank:14,cont:'خاورمیانه'}];
const FIELDS=[{n:'غوار',c:'عربستان سعودی'},{n:'بورگان',c:'کویت'},{n:'اهواز',c:'ایران'},{n:'گچساران',c:'ایران'},{n:'مارون',c:'ایران'},{n:'آغاجاری',c:'ایران'},{n:'کرنج',c:'ایران'},{n:'پارسی',c:'ایران'},{n:'شمال/جنوب پارس',c:'ایران و قطر'},{n:'کانتارل',c:'مکزیک'},{n:'تنگیز',c:'قزاقستان'},{n:'ساموتلور',c:'روسیه'},{n:'فردوس',c:'ایران'},{n:'اسفندیار',c:'ایران'},{n:'سروش',c:'ایران'},{n:'نوروز',c:'ایران'},{n:'کرکوک',c:'عراق'},{n:'رُمیله',c:'عراق'},{n:'زاکوم',c:'امارات'}];
const REF=[{n:'آبادان',c:'ایران'},{n:'تهران',c:'ایران'},{n:'اصفهان',c:'ایران'},{n:'بندرعباس',c:'ایران'},{n:'اراک (شازند)',c:'ایران'},{n:'تبریز',c:'ایران'},{n:'شیراز',c:'ایران'},{n:'ستاره خلیج فارس',c:'ایران'},{n:'جامناگر',c:'هند'},{n:'جورونگ',c:'سنگاپور'},{n:'راس‌تنوره',c:'عربستان'},{n:'روتردام',c:'هلند'}];
const GASES=[{name:'متان',f:'CH₄'},{name:'اتان',f:'C₂H₆'},{name:'پروپان',f:'C₃H₈'},{name:'بوتان',f:'C₄H₁₀'},{name:'هیدروژن',f:'H₂'},{name:'هلیم',f:'He'},{name:'نیتروژن',f:'N₂'},{name:'اکسیژن',f:'O₂'},{name:'دی‌اکسید کربن',f:'CO₂'},{name:'مونوکسید کربن',f:'CO'},{name:'سولفید هیدروژن',f:'H₂S'},{name:'آمونیاک',f:'NH₃'}];

// سوالات دست‌نویس
[{l:1,c:'عمومی',q:'نفت خام عمدتاً از چه عناصری تشکیل شده؟',o:['کربن و هیدروژن','اکسیژن و نیتروژن','گوگرد و فسفر','آهن و کربن'],a:0},
{l:1,c:'عمومی',q:'واحد بین‌المللی حجم نفت؟',o:['تن','بشکه','متر مکعب','گالن'],a:1},
