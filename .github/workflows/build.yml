name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create module structure
        run: |
          MOD="oilquiz"
          rm -rf "$MOD"
          mkdir -p "$MOD/src/main/java/com/ahvaz/oilquiz"
          mkdir -p "$MOD/src/main/res/layout"
          mkdir -p "$MOD/src/main/res/values"
          mkdir -p "$MOD/src/main/assets"

      - name: Copy files - index.html FIRST from root
        run: |
          MOD="oilquiz"
          # کپی index.html از ریشه — این مهم‌ترین خطه
          cp index.html "$MOD/src/main/assets/index.html"
          echo "✅ index.html copied from ROOT"
          echo "Size: $(wc -c < index.html) bytes"
          
          F=$(find . -name "MainActivity.java" -not -path "./.git/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/java/com/ahvaz/oilquiz/MainActivity.java"
          
          F=$(find . -name "AndroidManifest.xml" -not -path "./.git/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/AndroidManifest.xml"
          
          F=$(find . -name "activity_main.xml" -not -path "./.git/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/res/layout/activity_main.xml"
          
          F=$(find . -name "strings.xml" -not -path "./.git/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/res/values/strings.xml"
          
          F=$(find . -name "themes.xml" -not -path "./.git/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/res/values/themes.xml"

      - name: Write gradle files
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OilQuizApp"
          include ':oilquiz'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > oilquiz/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ahvaz.oilquiz'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ahvaz.oilquiz"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "5.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Verify index.html size
        run: |
          echo "=== index.html in build assets ==="
          ls -la oilquiz/src/main/assets/
          echo ""
          echo "=== First 20 lines of index.html ==="
          head -20 oilquiz/src/main/assets/index.html
          echo ""
          echo "=== Checking for features ==="
          grep -c "toggleTheme" oilquiz/src/main/assets/index.html && echo "✅ Theme toggle found" || echo "❌ Theme toggle MISSING"
          grep -c "soundCorrect" oilquiz/src/main/assets/index.html && echo "✅ Sound found" || echo "❌ Sound MISSING"
          grep -c "spawnParticles" oilquiz/src/main/assets/index.html && echo "✅ Particles found" || echo "❌ Particles MISSING"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew :oilquiz:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OilQuiz-APK-v5
          path: oilquiz/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
