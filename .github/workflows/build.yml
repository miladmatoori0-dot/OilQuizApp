name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create module structure
        run: |
          MOD="oilquiz"
          rm -rf "$MOD"
          mkdir -p "$MOD/src/main/java/com/ahvaz/oilquiz"
          mkdir -p "$MOD/src/main/res/layout"
          mkdir -p "$MOD/src/main/res/values"
          mkdir -p "$MOD/src/main/res/drawable"
          mkdir -p "$MOD/src/main/assets"

      - name: Copy index.html
        run: |
          MOD="oilquiz"
          cp index.html "$MOD/src/main/assets/index.html"
          echo "index.html size: $(wc -c < index.html) bytes"
          grep -c "toggleTheme" index.html && echo "✅ Theme OK" || echo "❌ Theme missing"
          grep -c "addQ" index.html && echo "✅ addQ OK" || echo "❌ addQ missing"

      - name: Write AndroidManifest.xml
        run: |
          cat > oilquiz/src/main/AndroidManifest.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="کوییز دانشکده نفت اهواز"
                  android:icon="@drawable/ic_oil"
                  android:theme="@style/Theme.OilQuiz"
                  android:hardwareAccelerated="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEOF

      - name: Write strings.xml
        run: |
          cat > oilquiz/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">کوییز دانشکده نفت اهواز</string>
          </resources>
          EOF

      - name: Write themes.xml
        run: |
          cat > oilquiz/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="Theme.OilQuiz" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#0d1b2a</item>
                  <item name="android:navigationBarColor">#0d1b2a</item>
                  <item name="android:windowBackground">#0d1b2a</item>
              </style>
          </resources>
          EOF

      - name: Write oil icon drawable
        run: |
          cat > oilquiz/src/main/res/drawable/ic_oil.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0d1b2a" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#ffb703" android:pathData="M54,18 L46,42 L62,42 Z"/>
              <path android:fillColor="#ffb703" android:pathData="M51,42h6v20h-6z"/>
              <path android:fillColor="#ffb703" android:strokeColor="#ffb703" android:strokeWidth="1.5" android:pathData="M46,42 L34,58 M62,42 L74,58"/>
              <path android:fillColor="#ffb703" android:strokeColor="#ffb703" android:strokeWidth="1" android:pathData="M40,50 L68,50 M37,54 L71,54"/>
              <path android:fillColor="#fb8500" android:pathData="M24,72 Q54,60 84,72 L84,84 Q54,72 24,84 Z"/>
              <path android:fillColor="#ffb703" android:pathData="M54,86 Q48,92 48,96 Q48,101 54,101 Q60,101 60,96 Q60,92 54,86 Z"/>
          </vector>
          EOF

      - name: Write MainActivity.java
        run: |
          cat > oilquiz/src/main/java/com/ahvaz/oilquiz/MainActivity.java << 'JAVAEOF'
          package com.ahvaz.oilquiz;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN);
                  webView = findViewById(R.id.webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setBuiltInZoomControls(false);
                  s.setSupportZoom(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  webView.loadUrl("file:///android_asset/index.html");
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack();
                          else { setEnabled(false); getOnBackPressedDispatcher().onBackPressed(); }
                      }
                  });
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          JAVAEOF

      - name: Write activity_main.xml
        run: |
          cat > oilquiz/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0d1b2a">
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

      - name: Write gradle files
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OilQuizAhvaz"
          include ':oilquiz'
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > oilquiz/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ahvaz.oilquiz'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ahvaz.oilquiz.v6"
                  minSdk 21
                  targetSdk 34
                  versionCode 6
                  versionName "6.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew :oilquiz:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OilQuiz-APK-v6
          path: oilquiz/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
