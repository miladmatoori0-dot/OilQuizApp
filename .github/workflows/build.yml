name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Reorganize existing files
        run: |
          mkdir -p app/src/main/java/com/ahvaz/oilquiz
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          M=$(find . -name "AndroidManifest.xml" -not -path "./.git/*" | head -1)
          [ -n "$M" ] && cp "$M" app/src/main/AndroidManifest.xml

          M=$(find . -name "MainActivity.java" -not -path "./.git/*" | head -1)
          [ -n "$M" ] && cp "$M" app/src/main/java/com/ahvaz/oilquiz/MainActivity.java

          M=$(find . -name "activity_main.xml" -not -path "./.git/*" | head -1)
          [ -n "$M" ] && cp "$M" app/src/main/res/layout/activity_main.xml

          M=$(find . -name "strings.xml" -not -path "./.git/*" | head -1)
          [ -n "$M" ] && cp "$M" app/src/main/res/values/strings.xml

          M=$(find . -name "themes.xml" -not -path "./.git/*" | head -1)
          [ -n "$M" ] && cp "$M" app/src/main/res/values/themes.xml

          M=$(find . -name "index.html" -not -path "./.git/*" | head -1)
          [ -n "$M" ] && cp "$M" app/src/main/assets/index.html

          # app/build.gradle
          M=$(grep -rl "com.android.application" --include="build.gradle" . 2>/dev/null | grep -v "./.git" | head -1)
          [ -n "$M" ] && cp "$M" app/build.gradle

      - name: Create missing root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          echo "=== build.gradle created ==="
          cat build.gradle

      - name: Create missing settings.gradle if needed
        run: |
          if [ ! -f settings.gradle ]; then
            cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OilQuizApp"
          include ':app'
          EOF
            echo "=== settings.gradle created ==="
          else
            echo "=== settings.gradle already exists ==="
          fi

      - name: Create missing gradle.properties if needed
        run: |
          if [ ! -f gradle.properties ]; then
            cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
            echo "=== gradle.properties created ==="
          else
            echo "=== gradle.properties already exists ==="
          fi

      - name: Create missing app/build.gradle if needed
        run: |
          if [ ! -f app/build.gradle ]; then
            cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ahvaz.oilquiz'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ahvaz.oilquiz"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
            echo "=== app/build.gradle created ==="
          else
            echo "=== app/build.gradle already exists ==="
          fi

      - name: Verify all files
        run: |
          REQUIRED="app/build.gradle build.gradle settings.gradle gradle.properties app/src/main/AndroidManifest.xml app/src/main/java/com/ahvaz/oilquiz/MainActivity.java app/src/main/res/layout/activity_main.xml app/src/main/res/values/strings.xml app/src/main/res/values/themes.xml app/src/main/assets/index.html"
          MISSING=0
          for f in $REQUIRED; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "===== $MISSING missing files ====="
            exit 1
          fi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OilQuiz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
