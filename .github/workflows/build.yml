name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Debug - what exists
        run: |
          echo "=== root ==="
          ls -la
          echo "=== what is 'app'? ==="
          file app 2>&1 || echo "no app"
        continue-on-error: true

      - name: Create fresh module directory
        run: |
          MOD="oilquiz"
          rm -rf "$MOD" || true
          mkdir -p "$MOD/src/main/java/com/ahvaz/oilquiz"
          mkdir -p "$MOD/src/main/res/layout"
          mkdir -p "$MOD/src/main/res/values"
          mkdir -p "$MOD/src/main/assets"
          echo "Created $MOD structure"
          ls -la "$MOD"

      - name: Copy source files from wherever they are
        run: |
          MOD="oilquiz"
          F=$(find . -name "index.html" -not -path "./.git/*" -not -path "./$MOD/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/assets/index.html" && echo "index.html <- $F"
          
          F=$(find . -name "MainActivity.java" -not -path "./.git/*" -not -path "./$MOD/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/java/com/ahvaz/oilquiz/MainActivity.java" && echo "MainActivity <- $F"
          
          F=$(find . -name "AndroidManifest.xml" -not -path "./.git/*" -not -path "./$MOD/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/AndroidManifest.xml" && echo "Manifest <- $F"
          
          F=$(find . -name "activity_main.xml" -not -path "./.git/*" -not -path "./$MOD/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/res/layout/activity_main.xml" && echo "activity_main <- $F"
          
          F=$(find . -name "strings.xml" -not -path "./.git/*" -not -path "./$MOD/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/res/values/strings.xml" && echo "strings <- $F"
          
          F=$(find . -name "themes.xml" -not -path "./.git/*" -not -path "./$MOD/*" | head -1)
          [ -n "$F" ] && cp "$F" "$MOD/src/main/res/values/themes.xml" && echo "themes <- $F"
          
          echo "=== copied files ==="
          find "$MOD" -type f

      - name: Write root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OilQuizApp"
          include ':oilquiz'
          EOF

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

      - name: Write oilquiz/build.gradle
        run: |
          cat > oilquiz/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ahvaz.oilquiz'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ahvaz.oilquiz"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Verify all files
        run: |
          echo "=== final structure ==="
          find . -type f -not -path "./.git/*" -not -path "*/gradle/wrapper/*" | sort
          echo ""
          echo "=== check required ==="
          for f in build.gradle settings.gradle gradle.properties oilquiz/build.gradle oilquiz/src/main/AndroidManifest.xml oilquiz/src/main/java/com/ahvaz/oilquiz/MainActivity.java oilquiz/src/main/res/layout/activity_main.xml oilquiz/src/main/res/values/strings.xml oilquiz/src/main/res/values/themes.xml oilquiz/src/main/assets/index.html; do
            if [ -f "$f" ]; then echo "OK $f"; else echo "MISSING $f"; fi
          done

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew :oilquiz:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OilQuiz-APK
          path: oilquiz/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
