// ============ توزیع یکتای سوالات ============
const LEVEL_POOLS={};
function getLevelPool(l){
  if(!LEVEL_POOLS[l]){
    let p=BANK.filter(q=>q.l===l);
    if(p.length<250&&l<4)p=p.concat(BANK.filter(q=>q.l===l+1).slice(0,250-p.length));
    if(p.length<250&&l>1)p=p.concat(BANK.filter(q=>q.l===l-1).slice(0,250-p.length));
    LEVEL_POOLS[l]=_shuffle(p);
  }
  return LEVEL_POOLS[l];
}
function stageLevel(id){if(id<=25)return 1;if(id<=50)return 2;if(id<=75)return 3;return 4}
function stagePassScore(id){return[60,70,75,80][stageLevel(id)-1]}
function getStageQuestions(stageId){
  const l=stageLevel(stageId);
  const idx=(stageId-1)%25;
  const pool=getLevelPool(l);
  const start=(idx*10)%pool.length;
  const qs=[];
  for(let i=0;i<10;i++)qs.push(pool[(start+i)%pool.length]);
  return qs;
}

// ============ ذخیره ============
const KEY='ahvaz_oil_quiz_v7';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return{stages:{},unlocked:1}}
function save(p){try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}

// ============ بازی ============
const state={stageId:null,questions:[],index:0,score:0,correct:0,wrong:0,answered:false,total:0};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){show('start');renderBestBadge()}
function renderBestBadge(){
  const p=load();
  const played=Object.values(p.stages).reduce((s,x)=>s+(x.plays||0),0);
  const box=document.getElementById('bestScoreBox');
  if(played>0){
    const best=Math.max(0,...Object.values(p.stages).map(s=>s.bestScore||0));
    box.classList.remove('hidden');
    box.innerHTML=`🏆 بهترین: <strong>${best}</strong> • بازی‌ها: ${played} • پاس‌شده: ${Object.values(p.stages).filter(s=>s.passed).length}/۱۰۰`;
  } else box.classList.add('hidden');
  document.getElementById('bankSize').textContent=BANK.length;
}
let activeLevel=1;
function showStagesScreen(l){activeLevel=l||activeLevel;renderLevelTabs();renderStageGrid();show('stagesScreen')}
function renderLevelTabs(){
  const p=load();
  const box=document.getElementById('levelTabs');
  box.innerHTML='';
  for(let l=1;l<=4;l++){
    const btn=document.createElement('button');
    const first=(l-1)*25+1;
    btn.textContent=`${['🌱','⚙️','🏭','🎓'][l-1]} ${first}-${l*25}`;
    if(l===activeLevel)btn.classList.add('active');
    if(first>p.unlocked)btn.classList.add('locked-tab');
    btn.onclick=()=>{activeLevel=l;renderLevelTabs();renderStageGrid();soundClick()};
    box.appendChild(btn);
  }
}
function renderStageGrid(){
  const p=load();
  const grid=document.getElementById('stageGrid');
  grid.innerHTML='';
  const first=(activeLevel-1)*25+1;
  for(let id=first;id<=activeLevel*25;id++){
    const rec=p.stages[id]||{};
    const unlocked=id<=p.unlocked;
    const btn=document.createElement('div');
    btn.className='stage-btn';
    if(!unlocked)btn.classList.add('locked');
    else if(rec.passed)btn.classList.add('passed');
    else if(id===p.unlocked)btn.classList.add('current');
    btn.innerHTML=`<div class="num">${id}</div>${rec.bestPercent?`<div class="pct">${rec.bestPercent}٪</div>`:''}`;
    if(unlocked)btn.onclick=()=>{soundClick();startStage(id)};
    grid.appendChild(btn);
  }
}
function startStage(id){
  const qs=getStageQuestions(id);
  if(qs.length<10){alert('سوال کافی نیست');return}
  state.stageId=id;
  state.total=10;
  state.questions=qs.map(q=>{
    const paired=q.o.map((opt,i)=>({opt,ok:i===q.a}));
    const sh=_shuffle(paired);
    return{cat:q.c,q:q.q,opts:sh.map(p=>p.opt),ans:sh.findIndex(p=>p.ok)};
  });
  state.index=0;state.score=0;state.correct=0;state.wrong=0;state.answered=false;
  show('quizScreen');renderQuestion();
}
function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false;
  document.getElementById('scorePill').textContent=`امتیاز: ${state.score}`;
  document.getElementById('questionCounter').textContent=`مرحله ${state.stageId} • سوال ${state.index+1}/${state.total}`;
  document.getElementById('progressFill').style.width=`${(state.index/state.total)*100}%`;
  document.getElementById('qCatTag').textContent=q.cat;
  document.getElementById('qText').textContent=q.q;
  const box=document.getElementById('optionsBox');
  box.innerHTML='';
  const letters=['الف','ب','ج','د'];
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-letter">${letters[i]}</span>${opt}`;
    btn.onclick=()=>selectAnswer(i);
    box.appendChild(btn);
  });
  document.getElementById('nextBtn').classList.add('hidden');
}
function selectAnswer(idx){
  if(state.answered)return;
  state.answered=true;
  const q=state.questions[state.index];
  const btns=document.querySelectorAll('#optionsBox .opt-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans)b.classList.add('correct');
    if(i===idx&&i!==q.ans)b.classList.add('wrong');
  });
  if(idx===q.ans){state.score+=10;state.correct++;soundCorrect()}else{state.wrong++;soundWrong()}
  document.getElementById('scorePill').textContent=`امتیاز: ${state.score}`;
  const nb=document.getElementById('nextBtn');
  nb.classList.remove('hidden');
  nb.textContent=(state.index===state.total-1)?'مشاهده نتیجه 🎯':'سوال بعدی ←';
}
function nextQuestion(){if(state.index<state.total-1){state.index++;renderQuestion()}else finishStage()}
function finishStage(){
  const total=state.total;
  const percent=Math.round((state.correct/total)*100);
  const id=state.stageId;
  const passScore=stagePassScore(id);
  const passed=percent>=passScore;
  const p=load();
  const rec=p.stages[id]||{bestScore:0,bestPercent:0,passed:false,plays:0};
  rec.plays=(rec.plays||0)+1;
  if(state.score>rec.bestScore)rec.bestScore=state.score;
  if(percent>rec.bestPercent)rec.bestPercent=percent;
  if(passed)rec.passed=true;
  p.stages[id]=rec;
  if(passed&&id===p.unlocked&&id<100)p.unlocked=id+1;
  save(p);
  let icon='📚',msg='';
  if(percent===100){icon='👑';msg='بی‌نقص!'}
  else if(percent>=90){icon='🏆';msg='فوق‌العاده!'}
  else if(percent>=75){icon='🥇';msg='عالی!'}
  else if(percent>=60){icon='🥈';msg='قابل قبول.'}
  else if(percent>=40){icon='🥉';msg='نیاز به مطالعه بیشتر.'}
  else{icon='📚';msg='منابع پایه را مرور کن.'}
  const retry=document.getElementById('retryInfo');
  retry.textContent='';
  if(passed){
    msg=`✅ مرحله ${id} را پاس کردی!<br>${msg}`;
    if(id<100&&p.unlocked>id)msg+=`<br><span style="color:var(--green);font-size:12px;">🔓 مرحله ${id+1} باز شد.</span>`;
    retry.textContent='💡 سوالات هر مرحله یکتاست.';
    setTimeout(soundWin,200);
  } else {
    msg=`❌ مرحله را پاس نکردی.<br>حد قبولی: ${passScore}٪ — نمره تو: ${percent}٪<br>${msg}`;
    retry.textContent='🔄 دوباره تلاش کن!';
    setTimeout(soundFail,200);
  }
  document.getElementById('resultIcon').textContent=icon;
  document.getElementById('resultScore').textContent=state.score;
  document.getElementById('resultMsg').innerHTML=msg+`<br><span style="color:var(--muted);font-size:12px;">${state.correct} صحیح از ${total}</span>`;
  document.getElementById('statCorrect').textContent=state.correct;
  document.getElementById('statWrong').textContent=state.wrong;
  document.getElementById('statPercent').textContent=percent+'%';
  const btns=document.getElementById('resultBtns');
  btns.innerHTML='';
  const again=document.createElement('button');
  again.className='btn-primary';
  again.textContent='🔁 تلاش مجدد';
  again.onclick=()=>startStage(id);
  btns.appendChild(again);
  if(passed&&id<100){
    const nxt=document.createElement('button');
    nxt.className='btn-green';
    nxt.textContent=`➡️ مرحله ${id+1}`;
    nxt.onclick=()=>startStage(id+1);
    btns.appendChild(nxt);
  }
  const list=document.createElement('button');
  list.textContent='📋 لیست مراحل';
  list.onclick=()=>showStagesScreen(stageLevel(id));
  btns.appendChild(list);
  const home=document.createElement('button');
  home.textContent='🏠 منوی اصلی';
  home.onclick=goHome;
  btns.appendChild(home);
  show('resultScreen');
}
function quitGame(){if(confirm('انصراف؟'))showStagesScreen(activeLevel)}
function showStats(){
  const p=load();
  const all=Object.values(p.stages);
  const played=all.reduce((s,x)=>s+(x.plays||0),0);
  const passedCount=all.filter(s=>s.passed).length;
  const avg=all.length?Math.round(all.reduce((s,x)=>s+(x.bestPercent||0),0)/all.length):0;
  let lh='';
  for(let l=1;l<=4;l++){
    let c=0;
    for(let i=(l-1)*25+1;i<=l*25;i++)if(p.stages[i]&&p.stages[i].passed)c++;
    lh+=`<div style="display:flex;justify-content:space-between;padding:9px 13px;background:var(--card2);border-radius:9px;margin:5px 0;font-size:12.5px;"><span>${['🌱 پایه','⚙️ متوسط','🏭 پیشرفته','🎓 حرفه‌ای'][l-1]}</span><span style="color:var(--accent);font-weight:bold;">${c}/25</span></div>`;
  }
  document.getElementById('statsContent').innerHTML=`
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${passedCount}</div><div class="stat-label">پاس‌شده</div></div>
      <div class="stat-box"><div class="stat-num">${played}</div><div class="stat-label">بازی</div></div>
      <div class="stat-box"><div class="stat-num">${avg}%</div><div class="stat-label">میانگین</div></div>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px;">بانک: <strong style="color:var(--accent);">${BANK.length}</strong> سوال</div>
    <h3>📈 پیشرفت</h3>${lh}
    <button class="btn-danger" style="margin-top:16px;" onclick="resetAll(true)">🗑️ پاک کردن پیشرفت</button>`;
  show('statsScreen');
}
function resetAll(f){if(!confirm('آمار پاک شود؟'))return;localStorage.removeItem(KEY);if(f)showStats();else goHome()}

// شروع
applyTheme();
document.querySelectorAll('.sound-btn').forEach(b=>{b.textContent=soundEnabled?'🔊':'🔇';b.classList.toggle('muted',!soundEnabled)});
renderBestBadge();
</script>
</body>
</html>
