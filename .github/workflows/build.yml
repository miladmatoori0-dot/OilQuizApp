name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix file structure
        run: |
          echo "===== Before ====="
          ls -la
          ls -la .github/workflows/ || true
          
          # اگر فایل‌ها اشتباهاً داخل .github/workflows هستند، به ریشه منتقل کن
          if [ -d ".github/workflows/app" ]; then
            mv .github/workflows/app ./app
          fi
          if [ -f ".github/workflows/build.gradle" ]; then
            mv .github/workflows/build.gradle ./build.gradle
          fi
          if [ -f ".github/workflows/settings.gradle" ]; then
            mv .github/workflows/settings.gradle ./settings.gradle
          fi
          if [ -f ".github/workflows/gradle.properties" ]; then
            mv .github/workflows/gradle.properties ./gradle.properties
          fi
          
          echo "===== After ====="
          ls -la
          ls -la app/ || true
          ls -la app/src/main/ || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OilQuiz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
