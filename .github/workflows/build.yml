name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare module structure
        run: |
          mkdir -p oilquiz/src/main/java/com/ahvaz/oilquiz
          mkdir -p oilquiz/src/main/res/layout
          mkdir -p oilquiz/src/main/res/values
          mkdir -p oilquiz/src/main/res/drawable
          mkdir -p oilquiz/src/main/assets

      - name: Copy all source files
        run: |
          cp index.html oilquiz/src/main/assets/index.html
          cp AndroidManifest.xml oilquiz/src/main/AndroidManifest.xml
          cp MainActivity.java oilquiz/src/main/java/com/ahvaz/oilquiz/MainActivity.java
          cp activity_main.xml oilquiz/src/main/res/layout/activity_main.xml
          cp strings.xml oilquiz/src/main/res/values/strings.xml
          cp themes.xml oilquiz/src/main/res/values/themes.xml
          cp ic_oil.xml oilquiz/src/main/res/drawable/ic_oil.xml
          echo "--- files copied ---"
          find oilquiz -type f

      - name: Write root build.gradle
        run: |
          echo "buildscript {" > build.gradle
          echo "    repositories { google(); mavenCentral() }" >> build.gradle
          echo "    dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }" >> build.gradle
          echo "}" >> build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

      - name: Write settings.gradle
        run: |
          echo "pluginManagement {" > settings.gradle
          echo "    repositories { google(); mavenCentral(); gradlePluginPortal() }" >> settings.gradle
          echo "}" >> settings.gradle
          echo "dependencyResolutionManagement {" >> settings.gradle
          echo "    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)" >> settings.gradle
          echo "    repositories { google(); mavenCentral() }" >> settings.gradle
          echo "}" >> settings.gradle
          echo 'rootProject.name = "OilQuizAhvaz"' >> settings.gradle
          echo "include ':oilquiz'" >> settings.gradle

      - name: Write gradle.properties
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

      - name: Write oilquiz build.gradle
        run: |
          echo "plugins { id 'com.android.application' }" > oilquiz/build.gradle
          echo "android {" >> oilquiz/build.gradle
          echo "    namespace 'com.ahvaz.oilquiz'" >> oilquiz/build.gradle
          echo "    compileSdk 34" >> oilquiz/build.gradle
          echo "    defaultConfig {" >> oilquiz/build.gradle
          echo "        applicationId 'com.ahvaz.oilquiz.v7'" >> oilquiz/build.gradle
          echo "        minSdk 21" >> oilquiz/build.gradle
          echo "        targetSdk 34" >> oilquiz/build.gradle
          echo "        versionCode 7" >> oilquiz/build.gradle
          echo "        versionName '7.0'" >> oilquiz/build.gradle
          echo "    }" >> oilquiz/build.gradle
          echo "    buildTypes { release { minifyEnabled false } }" >> oilquiz/build.gradle
          echo "    compileOptions {" >> oilquiz/build.gradle
          echo "        sourceCompatibility JavaVersion.VERSION_17" >> oilquiz/build.gradle
          echo "        targetCompatibility JavaVersion.VERSION_17" >> oilquiz/build.gradle
          echo "    }" >> oilquiz/build.gradle
          echo "}" >> oilquiz/build.gradle
          echo "dependencies {" >> oilquiz/build.gradle
          echo "    implementation 'androidx.appcompat:appcompat:1.6.1'" >> oilquiz/build.gradle
          echo "    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'" >> oilquiz/build.gradle
          echo "}" >> oilquiz/build.gradle

      - name: Show oilquiz build.gradle
        run: cat oilquiz/build.gradle

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew :oilquiz:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OilQuiz-APK-v7
          path: oilquiz/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
